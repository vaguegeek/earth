<!DOCTYPE html>
<html>

<script id="vertex-shader" type="x-shader/x-vertex">

attribute vec4 vPosition;
attribute vec4 vNormal;
varying vec3 N, L, E;
uniform mat4 modelViewMatrix;
uniform mat4 projectionMatrix;
uniform vec4 lightPosition;
uniform mat3 normalMatrix;

attribute float vHeight;
varying float fHeight; 

void main()
{
    vec3 pos = (modelViewMatrix * vPosition).xyz;
    
    // check for directional light
    
    if(lightPosition.w == 0.0) L = normalize(lightPosition.xyz);
    else L = normalize( lightPosition.xyz - pos );
    
    E =  -normalize(pos);
    N = normalize( normalMatrix*vNormal.xyz);

    gl_Position = projectionMatrix * modelViewMatrix * vPosition;

    fHeight = vHeight;
    
}
</script>

<script id="fragment-shader" type="x-shader/x-fragment">

precision mediump float;

uniform vec4 ambientProduct;
uniform vec4 diffuseProduct;
uniform vec4 specularProduct;
uniform float shininess;
varying vec3 N, L, E;
varying float fHeight; 

void main()
{    
    vec4 fColor;
    
    vec3 H = normalize( L + E );
    vec4 ambient = ambientProduct;

    float Kd = max( dot(L, N), 0.0 );
    vec4  diffuse = Kd*diffuseProduct;

    float Ks = pow( max(dot(N, H), 0.0), shininess );
    vec4  specular = Ks * specularProduct;
    
    if( dot(L, N) < 0.0 ) specular = vec4(0.0, 0.0, 0.0, 1.0);

    vec4 ocean = vec4(0.07, 0.30, 0.70, 1.0);
    vec4 low   = vec4(0.20, 0.50, 0.20, 1.0);
    vec4 mid   = vec4(0.50, 0.40, 0.25, 1.0);
    vec4 high  = vec4(0.95, 0.95, 0.95, 1.0);

    vec4 land = mix(low, mid, smoothstep(0.05, 0.3, fHeight));
    land      = mix(land, high, smoothstep(0.4, 0.7, fHeight));

    float isOcean = 1.0 - step(0.08, fHeight);
    vec4 base = mix(land, ocean, isOcean);

    fColor = (ambient + diffuse) * base + specular * isOcean;

    gl_FragColor = fColor;
}
</script>
